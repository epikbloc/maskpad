name: Build MaskPad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json \
            libpng libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net

      - name: Clone sources
        run: scripts/clone-sources.sh

      - name: Apply patches
        run: scripts/apply-patches.sh

      - name: Apply custom changes
        run: |
          cat > /tmp/custom.py << 'EOF'
          import sys
          filepath = "sources/2ship2harkinian/mm/2s2h/BenPort.cpp"
          with open(filepath, "r") as f:
              content = f.read()
          content = content.replace(
              "#include <cstdlib>",
              "#include <cstdlib>\n#include <filesystem>",
              1
          )
          content = content.replace(
              'CVarSetInteger("gInterpolationFPS", 20);',
              'CVarSetInteger("gInterpolationFPS", 60);\n        CVarSetFloat(CVAR_INTERNAL_RESOLUTION, 4.0f);'
          )
          bundle_code = "#ifdef __IOS__\n        {\n            std::string _appDir = Ship::Context::GetAppDirectoryPath(appShortName);\n            std::string _o2rDest = _appDir + \"/mm.o2r\";\n            if (!std::filesystem::exists(_o2rDest)) {\n                std::string _bundleO2r = Ship::Context::GetAppDirectoryPath(\"\") + \"/mm.o2r\";\n                if (std::filesystem::exists(_bundleO2r)) {\n                    std::filesystem::copy_file(_bundleO2r, _o2rDest);\n                    shouldGenerate = false;\n                }\n            } else {\n                shouldGenerate = false;\n            }\n        }\n#endif\n"
          content = content.replace(
              "        if (shouldGenerate) {",
              bundle_code + "        if (shouldGenerate) {"
          )
          with open(filepath, "w") as f:
              f.write(content)
          print("Custom changes applied")
          EOF
          python3 /tmp/custom.py

      - name: Configure
        run: scripts/configure-ios.sh --device

      - name: Build
        run: scripts/build-ios.sh --device

      - name: Package IPA
        run: |
          cd build-ios-device/mm/Release-iphoneos
          mkdir Payload
          mv MaskPad.app Payload/
          zip -r MaskPad.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MaskPad
          path: "build-ios-device/mm/Release-iphoneos/*.ipa"   