name: Build MaskPad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json \
            libpng libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net

      - name: Clone sources
        run: scripts/clone-sources.sh

      - name: Apply patches
        run: scripts/apply-patches.sh

      - name: Apply custom changes
        run: |
          SRC="sources/2ship2harkinian/mm/2s2h/BenPort.cpp"
          python3 - "$SRC" << 'PYEOF'
          import sys
          filepath = sys.argv[1]
          with open(filepath, 'r') as f:
              content = f.read()
          content = content.replace(
              '#include <cstdlib>',
              '#include <cstdlib>\n#include <filesystem>',
              1
          )
          content = content.replace(
              'CVarSetInteger("gInterpolationFPS", 20);',
              'CVarSetInteger("gInterpolationFPS", 60);\n        CVarSetFloat(CVAR_INTERNAL_RESOLUTION, 4.0f);'
          )
          bundle_code = '''#ifdef __IOS__
        {
            std::string _appDir = Ship::Context::GetAppDirectoryPath(appShortName);
            std::string _o2rDest = _appDir + "/mm.o2r";
            if (!std::filesystem::exists(_o2rDest)) {
                std::string _bundleO2r = Ship::Context::GetAppDirectoryPath("") + "/mm.o2r";
                if (std::filesystem::exists(_bundleO2r)) {
                    std::filesystem::copy_file(_bundleO2r, _o2rDest);
                    shouldGenerate = false;
                }
            } else {
                shouldGenerate = false;
            }
        }
          #endif
          '''
          content = content.replace(
              '        if (shouldGenerate) {',
              bundle_code + '        if (shouldGenerate) {'
          )
          with open(filepath, 'w') as f:
              f.write(content)
          print("Custom changes applied")
          PYEOF   

      - name: Configure
        run: scripts/configure-ios.sh --device

      - name: Build
        run: scripts/build-ios.sh --device

      - name: Package IPA
        run: |
          cd build-ios-device/mm/Release-iphoneos
          mkdir Payload
          mv MaskPad.app Payload/
          zip -r MaskPad.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MaskPad
          path: "*.ipa"   